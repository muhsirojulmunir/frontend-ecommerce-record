name: 🚀 Auto Deploy Frontend ke Dewaweb

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy ke recordshoes.com
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout kode terbaru
        uses: actions/checkout@v4

      - name: 🚀 Deploy via SSH ke cPanel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            echo "▶ Masuk ke folder frontend..."
            cd ~/public_html

            echo "▶ Pull kode terbaru dari GitHub..."
            git fetch origin
            git reset --hard origin/main
            echo "? Memastikan BACKEND_STORAGE_URL benar di .env..."
            if grep -q "BACKEND_STORAGE_URL" .env 2>/dev/null; then
              sed -i "s|BACKEND_STORAGE_URL=.*|BACKEND_STORAGE_URL=https://admin.recordshoes.com/storage|" .env
            else
              echo "BACKEND_STORAGE_URL=https://admin.recordshoes.com/storage" >> .env
            fi
            echo "  -> BACKEND_STORAGE_URL="

            echo "▶ Menentukan PHP 8.4..."
            PHP_BIN="php"
            for kandidat in \
                /usr/local/bin/ea-php84 \
                /opt/cpanel/ea-php84/root/usr/bin/php \
                /usr/local/bin/ea-php82 \
                /opt/cpanel/ea-php82/root/usr/bin/php; do
              if [ -x "$kandidat" ]; then PHP_BIN="$kandidat"; break; fi
            done
            echo "PHP: $(${PHP_BIN} -v | head -n 1)"

            echo "▶ Menjalankan migrasi database..."
            ${PHP_BIN} artisan migrate --force

            echo "▶ Menghubungkan storage link..."
            ${PHP_BIN} artisan storage:link --force 2>/dev/null || true

            echo "▶ Membersihkan cache lama..."
            rm -f bootstrap/cache/config.php
            rm -f bootstrap/cache/routes-v7.php
            rm -f bootstrap/cache/services.php
            rm -f bootstrap/cache/packages.php

            ${PHP_BIN} artisan config:clear
            ${PHP_BIN} artisan route:clear
            ${PHP_BIN} artisan view:clear
            ${PHP_BIN} artisan cache:clear 2>/dev/null || true

            echo "▶ Optimasi cache production..."
            ${PHP_BIN} artisan config:cache
            ${PHP_BIN} artisan route:cache
            ${PHP_BIN} artisan view:cache

            echo "✅ Deploy frontend selesai!"
